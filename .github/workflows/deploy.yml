
name: Deploy Uber Booking Service

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Booking Service
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Checkout Entity Service
      - name: Checkout Entity Service
        uses: actions/checkout@v4
        with:
          repository: nayansinghal23/uber-entity-service
          ref: master
          path: entity-service
          token: ${{ secrets.GITHUB_TOKEN }}

      # Publish Entity Service locally
      - name: Publish Entity Service to Maven Local
        working-directory: entity-service
        run: |
          chmod +x gradlew
          ./gradlew clean publishToMavenLocal

      # Build Booking Service
      - name: Build Booking Service
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar

      # Prepare JAR
      - name: Prepare JAR
        run: |
          JAR_FILE=$(find build/libs -maxdepth 1 -name "*.jar" ! -name "*-plain.jar" | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "JAR not found"
            exit 1
          fi

          cp "$JAR_FILE" booking-service.jar

      # SSH authentication
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      # Transfer JAR
      - name: Copy JAR to EC2
        run: |
          scp booking-service.jar \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/booking-service.jar

      # Deploy
      - name: Deploy to EC2
        run: |
          ssh -T ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e

            echo "Installing JAR..."

            sudo install -o ubuntu -g ubuntu -m 644 \
              /tmp/booking-service.jar \
              /opt/uber-booking-service/booking-service.jar

            rm /tmp/booking-service.jar

            echo "Restarting service..."

            sudo systemctl restart uber-booking-service

            echo "Waiting for application readiness..."

            for i in {1..12}; do
              if curl -s -o /dev/null \
                -w "%{http_code}" \
                -X GET \
                http://localhost:7479/api/v1/booking \
                -H "Content-Type: application/json" \
                -d '{"userId":1,"userType":"RIDER"}' | grep -qE '^(200|400)$'; then

                echo "Booking Service is responding!"
                exit 0
              fi

              echo "Waiting for application... attempt $i"
              sleep 5
            done

            echo "Deployment health check failed!"
            sudo journalctl -u uber-booking-service -n 80 --no-pager
            exit 1
          EOF