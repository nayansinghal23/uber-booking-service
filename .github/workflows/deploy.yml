
name: Deploy Uber Booking Service

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Build and run tests
      - name: Build application
        run: |
          chmod +x gradlew
          ./gradlew clean test bootJar

      # 5. Locate executable Spring Boot JAR
      - name: Prepare JAR
        run: |
          JAR_FILE=$(find build/libs -maxdepth 1 -name "*.jar" ! -name "*-plain.jar" | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "Spring Boot JAR not found!"
            exit 1
          fi

          cp "$JAR_FILE" booking-service.jar

      # 6. Configure SSH
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      # 7. Copy JAR to EC2
      - name: Copy JAR to EC2
        run: |
          scp booking-service.jar \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/booking-service.jar

      # 8. Deploy application
      - name: Deploy to EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e

            sudo install -o ubuntu -g ubuntu -m 644 \
              /tmp/booking-service.jar \
              /opt/uber-booking-service/booking-service.jar

            rm /tmp/booking-service.jar

            sudo systemctl restart uber-booking-service

            sleep 10

            sudo systemctl is-active --quiet uber-booking-service

            sudo ss -lntp | grep -q ':7479'

            echo "Booking Service deployed successfully!"
          EOF
